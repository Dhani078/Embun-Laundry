<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Buat Akun • Embun Laundry</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg1: #1f62f0;
  --bg2: #12cff0;
  --muted: #6b7280;
  --ink: #0f172a;
  --ring: #94b5ff;
  --shadow: 0 12px 30px rgba(0,0,0,.10);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: var(--ink);
  background: #f5f7fb;
}

/* background dengan blob lembut */
.page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 40px 14px;
  position: relative;
  overflow: hidden;
  background: radial-gradient(1200px 600px at -10% -20%, #cde7ff 0, transparent 55%),
              radial-gradient(800px 420px at 120% 120%, #d7fff6 0, transparent 60%);
}
.page::before, .page::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .22;
  pointer-events: none;
  animation: float 16s ease-in-out infinite;
}
.page::before {
  width: 520px;
  height: 520px;
  left: -200px;
  top: -140px;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
}
.page::after {
  width: 420px;
  height: 420px;
  right: -160px;
  bottom: -120px;
  background: linear-gradient(135deg, #20e3b2, #5ea3ff);
  animation-delay: -6s;
}
@keyframes float {
  50% { transform: translateY(-12px) scale(1.02); }
}

.card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 22px;
  box-shadow: var(--shadow);
  width: min(760px, 95%);
  padding: 26px 26px 24px;
  position: relative;
}

/* header brand */
.brand {
  display: flex;
  align-items: center;
  gap: .65rem;
  margin-bottom: 8px;
}
.logo-img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: contain;
  display: block;
  box-shadow: 0 0 0 3px #e9f2ff;
}
.brand-name { color: #2563eb; font-weight: 800; }

/* judul */
h1 { font-size: 20px; margin: 4px 0 6px; }
.small { font-size: 12px; color: var(--muted); }

/* grid form */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

label { font-size: 13px; font-weight: 600; color: #334155; }
.input, .select {
  border: 1px solid #d1d5db;
  padding: 12px 12px;
  border-radius: 12px;
  outline: 0;
  width: 100%;
  background: #fff;
  transition: box-shadow .15s ease, border-color .15s ease, transform .06s ease;
}
.input:focus, .select:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px #3b82f622; }
.input:active { transform: scale(.998); }

/* password field with toggle */
.passwrap { position: relative; }
.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  opacity: .7;
}

/* checkbox agree */
.ck { display: flex; align-items: flex-start; gap: .55rem; margin: 10px 0 0; }

/* alert */
.alert {
  background: #fff0f0;
  border: 1px solid #fecaca;
  color: #b91c1c;
  border-radius: 12px;
  padding: 10px 12px;
  margin: 8px 0 12px;
}

/* tombol */
.actions { margin-top: 14px; }
.btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .9rem 1.15rem;
  border-radius: 999px;
  border: 0;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  background: linear-gradient(90deg, var(--bg1), var(--bg2));
  color: #fff;
  box-shadow: var(--shadow);
  transition: transform .06s ease;
}
.btn:active { transform: scale(.985); }
.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: rip .6s linear;
  background: #ffffff66;
  pointer-events: none;
}
@keyframes rip { to { transform: scale(5); opacity: 0; } }

/* link */
.link { color: #2563eb; text-decoration: none; }
.link:hover { text-decoration: underline; }

/* footer kecil */
.bottom { margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <img src="../img/Logo.png" alt="Embun Laundry" class="logo-img" width="36" height="36" decoding="async" fetchpriority="high">
      <div class="brand-name">Embun Laundry</div>
    </div>

    <h1>Buat Akun Embun Laundry</h1>
    <div class="small" style="margin-top:-2px">Bergabung dan kelola kebutuhan laundry Anda</div>

    <div id="regErr" style="display: none;"></div>

    <form method="post" class="form" novalidate id="regForm">
      <input type="hidden" name="csrf_token" value="" id="csrfToken">
      <div class="grid">
        <div>
          <label>Nama Lengkap</label>
          <input class="input" type="text" name="full_name" id="full_name" required>
        </div>
        <div>
          <label>Email</label>
          <input class="input" type="email" name="email" id="email" required>
        </div>
        <div>
          <label>No. HP</label>
          <input class="input" type="text" name="phone" placeholder="0812-3456-7890" id="phone">
        </div>
        <div class="passwrap">
          <label>Kata Sandi</label>
          <input class="input" id="pw1" type="password" name="password" required>
          <button type="button" class="toggle" data-for="pw1" title="Tampilkan/Sembunyikan">👁️</button>
        </div>
        <div class="passwrap">
          <label>Konfirmasi Sandi</label>
          <input class="input" id="pw2" type="password" name="confirm" required>
          <button type="button" class="toggle" data-for="pw2" title="Tampilkan/Sembunyikan">👁️</button>
        </div>
      </div>

      <label class="ck">
        <input type="checkbox" name="agree" value="1" id="agree">
        <span>Saya setuju dengan
          <a class="link" href="#" onclick="alert('Contoh halaman S&K');return false;">Syarat & Ketentuan</a>
          dan
          <a class="link" href="#" onclick="alert('Contoh halaman Privasi');return false;">Kebijakan Privasi</a>
        </span>
      </label>

      <div class="actions">
        <button class="btn" type="submit">Buat Akun</button>
      </div>

      <div class="small bottom">
        Sudah punya akun? <a class="link" href="login.html">Masuk di sini</a>
      </div>
    </form>
  </div>
</div>

<script>
// CSRF token fetch
async function fetchCsrf() {
  try {
    const res = await fetch('/api/csrf');
    const data = await res.json();
    if (data.ok) document.getElementById('csrfToken').value = data.token;
  } catch(e) {}
}
fetchCsrf();

// Ripple untuk semua .btn
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const c = document.createElement('span');
  const d = Math.max(btn.clientWidth, btn.clientHeight);
  c.className = 'ripple';
  c.style.width = c.style.height = d + 'px';
  const rect = btn.getBoundingClientRect();
  c.style.left = (e.clientX - rect.left - d/2) + 'px';
  c.style.top = (e.clientY - rect.top - d/2) + 'px';
  btn.appendChild(c);
  setTimeout(() => c.remove(), 600);
});

// Toggle show/hide password
document.querySelectorAll('.toggle').forEach(tg => {
  tg.addEventListener('click', () => {
    const id = tg.getAttribute('data-for');
    const el = document.getElementById(id);
    if (!el) return;
    el.type = (el.type === 'password') ? 'text' : 'password';
    tg.textContent = (el.type === 'password') ? '👁️' : '🙈';
  });
});

// Register form submit
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('regErr');
  errEl.style.display = 'none';
  errEl.className = '';

  const form = e.target;
  const formData = new FormData(form);
  const body = Object.fromEntries(formData);

  if (body.password !== body.confirm) {
    errEl.textContent = '⚠️ Konfirmasi sandi tidak sama';
    errEl.style.display = 'block';
    errEl.style.background = '#fff0f0';
    errEl.style.border = '1px solid #fecaca';
    errEl.style.color = '#b91c1c';
    errEl.style.borderRadius = '12px';
    errEl.style.padding = '10px 12px';
    return;
  }

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: body.full_name,
        email: body.email,
        phone: body.phone,
        password: body.password
      })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/dashboard.html';
    } else {
      errEl.textContent = '⚠️ ' + (data.msg || 'Registrasi gagal');
      errEl.style.display = 'block';
      errEl.style.background = '#fff0f0';
      errEl.style.border = '1px solid #fecaca';
      errEl.style.color = '#b91c1c';
      errEl.style.borderRadius = '12px';
      errEl.style.padding = '10px 12px';
    }
  } catch (err) {
    errEl.textContent = '⚠️ Terjadi kesalahan jaringan';
    errEl.style.display = 'block';
    errEl.style.background = '#fff0f0';
    errEl.style.border = '1px solid #fecaca';
    errEl.style.color = '#b91c1c';
    errEl.style.borderRadius = '12px';
    errEl.style.padding = '10px 12px';
  }
});
</script>
</body>
</html>
