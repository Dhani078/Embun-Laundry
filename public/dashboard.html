<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard · Embun Laundry</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/design-tokens.css"/>
<link rel="stylesheet" href="/assets/style.css?v=3.1"/>
<link rel="icon" href="/img/Logo.png"/>
</head>
<body>

<a class="skip-link" href="#mainContent">Lewati ke konten</a>
<div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
<div class="wrap">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img
        src="/img/Logo.png"
        alt="Embun Laundry"
        class="logo-img"
        width="36" height="36"
        decoding="async"
        fetchpriority="high"
      />
      <div class="brand-text">Embun Laundry</div>
      <button id="sidebarCloseBtn" class="btn btn-icon sidebar-close-btn" type="button" aria-label="Tutup menu" title="Tutup">
        <span>✕</span>
      </button>
    </div>

    <nav class="nav">
      <a href="#" class="nav-link active" data-page="dashboard">
        <span>🏠</span> <span data-i18n="menu_dashboard">Dashboard</span>
      </a>
      <a href="#" class="nav-link" data-page="pesanan">
        <span>🧺</span> <span data-i18n="menu_orders">Pesanan</span>
      </a>
      <a href="#" class="nav-link" data-page="pelanggan">
        <span>👥</span> <span data-i18n="menu_customers">Pelanggan</span>
      </a>
      <a href="#" class="nav-link" data-page="layanan">
        <span>💲</span> <span data-i18n="menu_services">Layanan & Harga</span>
      </a>
      <a href="#" class="nav-link" data-page="delivery">
        <span>🚚</span> <span data-i18n="menu_delivery">Pickup & Delivery</span>
      </a>
      <a href="#" class="nav-link" data-page="promo">
        <span>🏷️</span> <span data-i18n="menu_promos">Promo & Voucher</span>
      </a>
      <a href="#" class="nav-link" data-page="laporan">
        <span>📑</span> <span data-i18n="menu_reports">Laporan</span>
      </a>
      <a href="#" class="nav-link staff-only" data-page="activity-log">
        <span>📋</span> <span data-i18n="menu_activity_log">Riwayat Aktivitas</span>
      </a>
    </nav>

    <div class="side-bottom">
      <a href="#" class="btn nav-link" data-page="profile"><span>👤</span> <span data-i18n="menu_profile">Profil</span></a>
      <button id="logoutBtn" class="btn" style="width: 100%; text-align: left; background: transparent; border: none; color: inherit; cursor: pointer;">
        <span>🚪</span> <span data-i18n="menu_logout">Keluar</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <section class="main">
    <div class="topbar">
      <div class="topbar-inner">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="sidebarToggleBtn" class="btn btn-icon sidebar-toggle-btn" type="button" aria-label="Buka navigasi menu" title="Menu Navigasi">
            <span>☰</span>
          </button>
          <div class="h1" id="pageTitle">Dashboard</div>
          <div class="badge" id="roleBadge" style="margin-left:4px"><span class="skeleton" style="width:48px;height:12px;display:inline-block;vertical-align:middle;border-radius:4px;"></span></div>
        </div>
        <div style="margin-left:auto; display: flex; align-items: center; gap: 12px;">
          <button id="cmdPaletteBtn" class="cmd-palette-trigger" type="button" aria-label="Command Palette (Ctrl+K)" title="Command Palette (Ctrl+K)" style="padding: 6px 10px; font-size: 12px; border-radius: 8px; border: 1px solid var(--border-light, var(--line)); background: var(--bg-card, var(--card)); color: var(--muted, #64748b); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
            <span>🔍</span> <span style="font-size: 12px; font-weight: 600;">Cari...</span> <kbd style="font-size: 10px; padding: 2px 4px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); font-family: inherit; font-weight: 700;">Ctrl K</kbd>
          </button>
          <button id="langToggleBtn" class="lang-toggle-btn" type="button" aria-label="Ganti Bahasa" title="Ganti Bahasa / Switch Language" style="padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--text-main); cursor: pointer;">
            <span id="langLabel">🌐 EN</span>
          </button>
          <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Ubah Tema (Gelap / Terang)">
            <span class="theme-icon" id="themeIcon">🌙</span>
          </button>
          <button id="refreshPageBtn" class="btn btn-ghost refresh-page-btn" type="button" aria-label="Segarkan data" title="Segarkan Data Halaman" style="padding: 6px 10px; font-size: 13px; border-radius: 8px; border: 1px solid var(--border-light, var(--line)); background: var(--bg-card, var(--card)); color: var(--text-main, var(--text)); cursor: pointer; display: inline-flex; align-items: center;">
            <span id="refreshIcon" style="display:inline-block;">🔄</span>
          </button>
          <div style="position: relative;">
            <button id="notifBellBtn" class="btn btn-ghost notif-bell-btn" type="button" aria-label="Notifikasi Aktivitas" title="Notifikasi Aktivitas" style="position: relative; padding: 6px 10px; font-size: 13px; border-radius: 8px; border: 1px solid var(--border-light, var(--line)); background: var(--bg-card, var(--card)); color: var(--text-main, var(--text)); cursor: pointer; display: inline-flex; align-items: center;">
              <span>🔔</span>
              <span id="notifBadge" style="display: none; position: absolute; top: -4px; right: -4px; background: var(--red, #ef4444); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 99px; line-height: 1.2;">0</span>
            </button>
            <div id="notifDropdown" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 290px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); z-index: 1000; padding: 14px; font-size: 13px;">
              <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px;">
                <span style="font-weight: 700; color: var(--text);">Notifikasi Aktivitas</span>
                <span id="notifStatusSummary" style="font-size: 11px; color: var(--muted);">Terbaru</span>
              </div>
              <div id="notifList" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                <div style="font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0;">Memuat notifikasi...</div>
              </div>
            </div>
          </div>
          <span id="userName" style="display: inline-flex; align-items: center; min-width: 84px; height: 18px; border-radius: 4px;" class="skeleton"></span>
        </div>
      </div>
    </div>

    <div class="content" id="mainContent">
      <!-- Dynamic Page Content -->
    </div>
  </section>
</div>

<!-- B9: escaping HTML untuk data dari API (lihat public/assets/escape.js) -->
<script src="/assets/escape.js"></script>
<script src="/assets/qrcode-lib.js"></script>
<script src="/assets/qrcode.js"></script>
<script src="/app.js?v=3.1"></script>
<script>
  // C9: daftarkan service worker untuk mode offline dasar.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
