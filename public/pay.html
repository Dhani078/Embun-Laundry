<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pembayaran · Embun Laundry</title>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>
<body style="background: #f8fafc; padding: 20px; display: grid; place-items: center; min-height: 100vh; margin: 0;">
  <div class="card" style="width: 100%; max-width: 440px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);">
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="/img/Logo.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 10px; margin-bottom: 8px;">
      <h3 style="margin: 0; font-size: 18px; font-weight: 800;">Pembayaran Laundry</h3>
      <p id="ordCodeLabel" style="margin: 4px 0 0; color: #64748b; font-size: 13px;">Memuat rincian...</p>
    </div>

    <div id="payContent">
      <div style="text-align: center; padding: 20px; color: #64748b;">Memuat data tagihan...</div>
    </div>

    <div style="margin-top: 24px; text-align: center;">
      <a href="/" class="btn" style="padding: 8px 16px; font-size: 13px;">← Kembali ke Dashboard</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    async function loadPay() {
      if (!code) {
        document.getElementById('payContent').innerHTML = '<div class="err">Kode pesanan tidak ditemukan di URL</div>';
        return;
      }
      try {
        const res = await fetch('/api/pay?order_code=' + encodeURIComponent(code));
        const data = await res.json();
        if (!data.ok) {
          document.getElementById('payContent').innerHTML = '<div class="err">' + (data.msg || 'Gagal memuat pesanan') + '</div>';
          return;
        }

        const o = data.order;
        document.getElementById('ordCodeLabel').textContent = o.order_code + ' • ' + o.customer_name;

        document.getElementById('payContent').innerHTML = `
          <div style="background: #f1f5f9; border-radius: 10px; padding: 14px; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
              <span>Layanan:</span> <span style="font-weight: 600;">${o.service_name} (${o.weight_kg} kg)</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
              <span>Total Tagihan:</span> <span style="font-weight: 800; color: #2563eb; font-size: 16px;">Rp ${Number(o.total_amount).toLocaleString('id-ID')}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 13px;">
              <span>Status Bayar:</span> <span style="font-weight: 700;">${o.payment_status || 'unpaid'}</span>
            </div>
          </div>

          <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 12px;">Scan QRIS untuk Pembayaran Instant</div>
            <div style="width: 200px; height: 200px; margin: 0 auto; background: #fff; border: 2px dashed #cbd5e1; border-radius: 12px; display: grid; place-items: center;">
              <div style="font-size: 11px; color: #94a3b8; text-align: center; padding: 12px;">
                <div style="font-size: 32px; margin-bottom: 8px;">📱</div>
                QRIS Dinamis<br><strong>${o.order_code}</strong><br>Rp ${Number(o.total_amount).toLocaleString('id-ID')}
              </div>
            </div>
          </div>

          <button class="btn btn-primary" id="confirmPayBtn" style="width: 100%; padding: 12px; font-weight: 700;">
            Konfirmasi Pembayaran Selesai
          </button>
        `;

        document.getElementById('confirmPayBtn').onclick = async () => {
          alert('Pembayaran diverifikasi! Petugas akan segera memproses cucian Anda.');
          window.location.href = '/';
        };

      } catch (e) {
        document.getElementById('payContent').innerHTML = '<div class="err">Kesalahan koneksi</div>';
      }
    }

    loadPay();
  </script>
</body>
</html>
