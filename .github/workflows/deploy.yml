name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Verification Tests & Asset Build
        run: |
          npm test
          npm run build

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret kosong — set di Settings > Secrets"
            exit 1
          fi
          echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:6} length: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler whoami 2>&1 | tail -6
          npx wrangler deploy 2>&1 | tee /tmp/wrangler.log
          grep -q "Deployed" /tmp/wrangler.log || {
            echo "::error::Deploy gagal. Log lengkap:"
            cat /tmp/wrangler.log
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
